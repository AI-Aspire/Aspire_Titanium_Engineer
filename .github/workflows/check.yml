name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The interpreter students get from `uv python install`, not the one the
      # runner image happens to ship (which differs at the patch level).
      - name: Install the pinned Python
        run: uv python install
        env:
          UV_PYTHON_PREFERENCE: only-managed
      # Every group, as `make setup` installs them: the syntax check resolves
      # each notebook's imports, and the optimisation and graph modules import
      # packages that live in optional groups.
      - name: Install the pinned environment
        run: uv sync --frozen --all-groups
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Prose and brand lint
        run: uv run python scripts/nb_lint.py
      - name: Code cells compile and imports resolve
        run: uv run python scripts/check_syntax.py
      - name: Every import is declared
        run: uv run python scripts/check_deps.py
      - name: Relative links
        run: uv run python scripts/check_links.py
      - name: marimo mirrors are current
        run: uv run python scripts/make_marimo.py --check
      - name: No secrets or internal endpoints in outputs
        run: uv run python scripts/strip_outputs.py --check
      # Every module has landed, so the committed seed must cover all five days.
      - name: Seed validates
        run: uv run python scripts/check_workspace.py --seed
      - name: Tests
        run: uv run python -m pytest tests/ -q
