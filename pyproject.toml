[project]
name = "aspire-titanium-engineer"
version = "0.1.0"
description = "Titanium Engineer: AI Aspire's five-day intensive for enterprise engineers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # What `helpers` itself needs to import. Deliberately small: a module with
    # its own environment (RAGAS, voice) depends on this package to get the
    # shared helpers, and must not inherit the course's LangChain pins with it.
    # Everything heavier is lazily imported inside the functions that use it
    # and declared in the `course` group below.
    "python-dotenv>=1.2",
    "ipython>=8.30",          # helpers/display.py and helpers/ui.py render through it
    "litellm>=1.90",          # helpers/judge.py
    "openai>=1.66",           # helpers/llm.py
    "numpy>=1.26",            # helpers/llm.py embed()
    "rich>=13.7",             # helpers/ui.py tables
]


[dependency-groups]
course = [
    # The course stack. Installed by default into the shared environment
    # (see tool.uv default-groups) but not part of this package's metadata.

    # Core LLM clients
    "litellm>=1.90",
    "openai>=1.66",
    "anthropic>=0.40",
    "python-dotenv>=1.2",
    "pydantic>=2.9",
    "openai-agents>=0.2,<1",
    "cryptography>=43,<46",   # keeps Intel-Mac installs on binary wheels

    # LangChain 1.x line and the RAG stack
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-community>=0.4",
    "langchain-openai>=1.3",
    "langchain-qdrant>=1.1",
    "langchain-tavily>=0.2,<0.3",
    "langchain-text-splitters>=1.1",
    "langgraph>=1,<2",
    "qdrant-client>=1.12",
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
    "rank-bm25>=0.2.2",
    "cohere>=5.0",
    "pypdf>=5.0.0",
    # Intel macOS: newer wheels are not published for these
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # Data and display
    "numpy>=1.26",
    "pandas>=2.2,!=3.0.4",
    "matplotlib>=3.9",
    "rich>=13.7",
    "tiktoken>=0.8",

    # Tools, skills, MCP, sub-agents
    "mcp>=1.2",

    # Evaluation frameworks
    "deepeval>=4.1,<5",

    # Notebooks
    "ipython>=8.30",          # helpers/display.py and helpers/ui.py render through it
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.0",
    "nbformat>=5.10",

    # Group project app
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "nbclient>=0.10",
    "marimo==0.24.2",     # pinned exactly: its version lands in every generated .py
    "pyflakes>=3.2",
]
optim = [
    "dspy>=3.0",
]
graph = [
    "spacy>=3.8",
    "networkx>=3.3",
    "rdflib>=7.0",
    # The English model is a dependency, not a side effect of a download
    # command. Declared here it survives `uv sync`; installed by hand it does
    # not, and the graph notebook then fails on a machine that worked before.
    "en_core_web_sm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `helpers` is installed into the environment rather than reached through a
# sys.path line in every notebook. A path line has to guess where the notebook
# is, and the guess differs between Jupyter (working directory is the module
# folder) and marimo (working directory is wherever you launched it). An
# installed package is found from any directory, in either tool, and in the
# tests and the app as well.
[tool.hatch.build.targets.wheel]
packages = ["helpers"]

[tool.uv]
package = true
# `uv sync` installs these without being asked, so the shared environment is
# complete while the package metadata above stays light.
default-groups = ["course", "dev"]

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.titanium]
# Modules that keep their own environment (a pyproject.toml inside the module).
own_env = ["08_SDG_RAGAS", "14_Voice_Agents"]
# Modules that run with no API key against the seed.
offline = ["19_Responsible_AI"]
