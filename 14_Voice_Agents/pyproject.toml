# This module has its OWN virtual environment, isolated from the repository's shared one.
#
# A voice-led research panel over your own workspace: a planner fans out to three
# researchers (which search your corpus, and the web when a Tavily key is set),
# an aggregator drafts, a critic attacks, a judge decides. Every role speaks in
# its own voice through an OpenAI-compatible TTS service and streams to a web app.
#
# Requires, beyond pip:
#   - a speech-to-text service (STT_BASE) and a text-to-speech service (TTS_BASE),
#     both OpenAI-compatible; see the README for the endpoints and env names
#   - ffmpeg on the host, only for the web app's microphone button
#
# Setup (from this folder):
#   uv sync
#   uv run jupyter lab

[project]
name = "titanium-voice-agents"
version = "0.1.0"
description = "Voice agents: a research panel you can talk to, over your own workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
    "marimo==0.24.2",         # the mirror beside the notebook runs in this environment
    "aspire-titanium-engineer",   # the shared helpers, from the repository root
    "ipython>=8.30",
    # LLM + agent orchestration (OpenAI-compatible)
    "openai>=1.66",
    "litellm>=1.90",
    "python-dotenv>=1.2",
    "pydantic>=2.9",

    # The web app
    "fastapi>=0.110",           # the web app
    "uvicorn[standard]>=0.29",  # ASGI server (also gives us websockets)
    "httpx>=0.27",              # STT/TTS clients, page fetch, Tavily

    # Audio (talk to the STT/TTS HTTP services; handle WAV)
    "soundfile>=0.12",
    "numpy>=1.26",

    # Notebook + display
    "rich>=13.7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.0",
]

[tool.uv]
package = true

[tool.uv.sources]
aspire-titanium-engineer = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This module ships its own package so the notebook imports it by name from
# any working directory, in Jupyter and in marimo alike.
[tool.hatch.build.targets.wheel]
packages = ["voice_panel"]
